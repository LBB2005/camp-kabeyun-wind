name: Daily Wind Briefing

on:
  schedule:
    # 10:00 UTC = 6:00 AM EDT (UTC-4, summer / camp season)
    - cron: '0 10 * * *'
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write # needed to commit history.json back

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weather alert
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TOMORROW_IO_API_KEY: ${{ secrets.TOMORROW_IO_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weather_alert.py

      - name: Commit updated history
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@kabeyun"
          git add history.json
          git diff --cached --quiet || git commit -m "chore: update weather history $(date -u +%Y-%m-%d)"
          git push
